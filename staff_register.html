
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration | Smart Lab Fault Reporter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #153e68;
            color: white;
            padding: 20px 5%;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 550px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #153e68;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        /* Password visibility styling */
        .password-box {
            position: relative;
            width: 100%;
        }

        .password-box input {
            width: 100%;
            padding: 12px 48px 12px 12px;
        }

        .password-box .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            padding: 5px;
            margin: 0;
            background: transparent;
            color: #153e68;
            border: none;
            border-radius: 0;
            font-size: 19px;
            cursor: pointer;
        }

        .password-box .toggle-password:hover {
            background: transparent;
            color: #2563eb;
        }

        /* Registration button */
        .submit-button {
            width: 100%;
            padding: 13px;
            background: #153e68;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1d5b91;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #fee2e2;
            color: #991b1b;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            display: block;
            margin-top: 10px;
            color: #153e68;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Lab Fault Reporter</h1>
</header>

<div class="container">

    <h2>Staff Registration</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="{{ url_for('staff_register') }}" method="POST">

        <div class="form-group">
            <label>Staff Registration Code</label>
            <input type="password" name="registration_code"
                   placeholder="Enter registration code" required>
        </div>

        <div class="form-group">
            <label>Staff Username</label>
            <input type="text" name="staff_username"
                   placeholder="Create username" required>
        </div>

        <div class="form-group">
            <label>Staff Name</label>
            <input type="text" name="staff_name"
                   placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label>Department</label>
            <select name="department" required>
                <option value="">Select Department</option>
                <option value="CSE">Computer Science</option>
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics</option>
                <option value="EEE">Electrical</option>
                <option value="MECH">Mechanical</option>
            </select>
        </div>

        <div class="form-group">
            <label>Staff Code</label>
            <input type="text" name="staff_code"
                   placeholder="Example: 040" required>
        </div>

        <div class="form-group">
            <label>Staff Role</label>
            <select name="staff_role" required>
                <option value="">Select Role</option>
                <option value="Lab Staff">Lab Staff</option>
                <option value="Lab Assistant">Lab Assistant</option>
            </select>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-box">
                <input type="password" name="password"
                       id="password"
                       placeholder="Create password" required>

                <button type="button"
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password">
                    👁
                </button>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>

            <div class="password-box">
                <input type="password" name="confirm_password"
                       id="confirm_password"
                       placeholder="Confirm password" required>

                <button type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirm_password', this)"
                        aria-label="Show password">
                    👁
                </button>
            </div>
        </div>

        <button type="submit" class="submit-button">
            Register Staff Account
        </button>

    </form>

    <div class="links">
        <a href="{{ url_for('admin_login') }}">
            Already registered? Staff Login
        </a>

        <a href="{{ url_for('home') }}">
            Back to Home
        </a>
    </div>

</div>

<script>
    function togglePassword(inputId, button) {
        const password = document.getElementById(inputId);

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "🙈";
            button.setAttribute("aria-label", "Hide password");
        } else {
            password.type = "password";
            button.textContent = "👁";
            button.setAttribute("aria-label", "Show password");
        }
    }
</script>

</body>
</html>
