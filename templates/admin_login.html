
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Smart Lab Fault Reporter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #153e68;
            color: white;
            text-align: center;
            padding: 22px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 430px;
            margin: 65px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #153e68;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #153e68;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d5b91;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #fee2e2;
            color: #991b1b;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            display: block;
            margin-top: 12px;
            color: #153e68;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Lab Fault Reporter</h1>
</header>

<div class="container">

    <h2>Staff Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST">

        <div class="form-group">
            <label for="staff_username">Staff Username</label>
            <input type="text" name="staff_username"
                   id="staff_username"
                   placeholder="Enter your staff username" required>
        </div>


<div class="form-group">
    <label for="password">Password</label>

    <div class="password-box">
        <input type="password" name="password"
               id="password"
               placeholder="Enter your password" required>

        <button type="button" class="toggle-password"
                onclick="togglePassword()"
                aria-label="Show password">
            👁
        </button>
    </div>
</div>

<style>
    .password-box {
        position: relative;
    }

    .password-box input {
        padding-right: 45px;
    }

    .toggle-password {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        padding: 6px;
        background: transparent;
        color: #153e68;
        border: none;
        cursor: pointer;
        font-size: 18px;
    }

    .toggle-password:hover {
        background: transparent;
    }
</style>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const button = document.querySelector(".toggle-password");

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "🙈";
            button.setAttribute("aria-label", "Hide password");
        } else {
            password.type = "password";
            button.textContent = "👁";
            button.setAttribute("aria-label", "Show password");
        }
    }
</script>


        <button type="submit">Login</button>

    </form>

    <div class="links">
        <a href="{{ url_for('staff_register') }}">New Staff? Register Here</a>
        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>

</div>

</body>
</html>
